<html lang="ru" prefix="og: https://ogp.me/ns#">

<head>

  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta property="og:type" content="website">
  <link rel="apple-touch-icon" sizes="180x180" href="/favicon/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon/favicon-16x16.png">
  <link rel="manifest" href="/favicon/site.webmanifest">
  <!-- <link rel="yandex-tableau-widget" href="/favicon/manifest.json"> -->
  <link rel="mask-icon" href="/favicon/safari-pinned-tab.svg" color="#5bbad5">
  <meta name="msapplication-TileColor" content="#da532c">
  <meta name="theme-color" content="#ffffff">


</head>

<body>
  <noscript>You need to enable JavaScript to run this app.</noscript>

  <div id="root">
    <p style="padding:20px;font:14px Roboto,Arial,sans-serif">
      Загрузка… Если сообщение не исчезло, обновите страницу.
    </p>
  </div>

  <script>
    (function () {
      function show(text) {
        if (document.body.dataset.diagShown) return;
        document.body.dataset.diagShown = '1';

        var pre = document.createElement('pre');
        pre.style.cssText =
          'position:fixed;top:0;left:0;right:0;z-index:99999;max-height:60vh;overflow:auto;' +
          'white-space:pre-wrap;font:12px/1.4 monospace;color:#b00020;' +
          'background:#fff5f5;border-bottom:1px solid #f3c2c2;padding:12px;margin:0';
        pre.textContent = text;
        document.body.appendChild(pre);
      }

      window.addEventListener('error', function (event) {
        // именно эта ветка ловит «скрипт не загрузился»
        if (event.target && event.target.tagName === 'SCRIPT') {
          show('Не загрузился скрипт: ' + (event.target.src || ''));
          return;
        }

        show('Ошибка: ' + (event.message || '') +
          '\n' + (event.filename || '') + ':' + (event.lineno || ''));
      }, true);   // ← ключевое отличие: фаза перехвата

      window.addEventListener('unhandledrejection', function (event) {
        var reason = event.reason;
        show('Promise: ' + (reason && (reason.message || reason.name || String(reason))));
      });
    })();
  </script>

  <script type="module" src="/src/index.jsx"></script>
</body>

</html>
