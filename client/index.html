<!DOCTYPE html>
<html lang="ru" prefix="og: https://ogp.me/ns#">

<head>
  <!-- <meta name="yandex-verification" content="19cc9b6477c0fd3e"> -->
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta property="og:type" content="website">
  <link rel="apple-touch-icon" sizes="180x180" href="/favicon/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon/favicon-16x16.png">
  <link rel="manifest" href="/favicon/site.webmanifest">
  <!-- <link rel="yandex-tableau-widget" href="/favicon/manifest.json"> -->
  <link rel="mask-icon" href="/favicon/safari-pinned-tab.svg" color="#5bbad5">
  <meta name="msapplication-TileColor" content="#da532c">
  <meta name="theme-color" content="#ffffff">


</head>

<body>
  <noscript>You need to enable JavaScript to run this app.</noscript>

  <div id="root">
    <p style="padding:20px;font:14px Roboto,Arial,sans-serif">
      Загрузка… Если сообщение не исчезло, обновите страницу.
    </p>
  </div>

  <script>
    (function () {
      // Экранный блок включается только вручную: ?debug=1. Обычным посетителям не мешает.
      var isDebug = window.location.search.indexOf('debug=1') !== -1;

      function show(text) {
        var pre = document.getElementById('diag-box');

        if (!pre) {
          pre = document.createElement('pre');
          pre.id = 'diag-box';
          pre.style.cssText =
            'position:fixed;bottom:0;left:0;right:0;z-index:99999;max-height:40vh;overflow:auto;' +
            'white-space:pre-wrap;font:12px/1.4 monospace;color:#b00020;' +
            'background:#fff5f5;border-top:1px solid #f3c2c2;padding:10px;margin:0';
          document.body.appendChild(pre);
        }

        pre.textContent += text + '\n';
      }

      function report(kind, text) {
        console.error('[diag][' + kind + '] ' + text); // eslint-disable-line no-console

        if (isDebug) {
          show(kind + ': ' + text);
        }
      }

      window.addEventListener(
        'error',
        function (event) {
          var target = event.target;

          // Ошибка загрузки ресурса: у неё нет message, а target — сам элемент
          if (target && target !== window && target.tagName) {
            var tag = target.tagName.toLowerCase();
            var src = target.src || target.href || '';

            if (tag === 'script') {
              report('script', 'не загрузился ' + src);
              return;
            }

            // Картинки, шрифты, CSS приложение не роняют — только предупреждение
            console.warn('[diag][resource] не загрузился ' + tag + ': ' + src); // eslint-disable-line no-console
            return;
          }

          report(
            'error',
            (event.message || 'нет сообщения') +
            ' | ' + (event.filename || 'без файла') + ':' + (event.lineno || 0)
          );
        },
        true
      );

      window.addEventListener('unhandledrejection', function (event) {
        var reason = event.reason;
        var text =
          (reason && (reason.message || reason.name || String(reason))) || 'промис отклонён без описания';

        report('promise', text);
      });
    })();
  </script>

  <script type="module" src="/src/index.jsx"></script>
</body>

</html>
